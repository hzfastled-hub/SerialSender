name: Build SerialSender

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pyserial pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --console --name SerialSender --clean serial_sender.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SerialSender-${{ matrix.os }}
        path: dist/SerialSender*